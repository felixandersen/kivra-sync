<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivra Sync</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Kivra Sync</h1>
            <p class="subtitle">Sync your documents for archiving</p>
        </header>
        
        <main>
            <div class="status-section">
                <div id="status" class="status idle">
                    <span id="status-text">Ready to sync</span>
                </div>
            </div>
            
            <form id="settings" class="settings-section" autocomplete="off">
                <div class="field">
                    <label for="ssnInput">Personal identity number</label>
                    <input id="ssnInput" type="text" inputmode="numeric" placeholder="YYYYMMDDXXXX"
                           maxlength="13" spellcheck="false">
                    <p id="ssnHint" class="field-hint">Saved in this browser only.</p>
                </div>
                <fieldset class="field">
                    <legend>Account</legend>
                    <div class="segmented">
                        <input type="radio" name="accountMode" id="modePersonal" value="personal" checked>
                        <label for="modePersonal">Personal</label>
                        <input type="radio" name="accountMode" id="modeBusiness" value="business">
                        <label for="modeBusiness">Business</label>
                        <input type="radio" name="accountMode" id="modeBoth" value="both">
                        <label for="modeBoth">Both</label>
                    </div>
                </fieldset>
            </form>
            
            <div class="action-section">
                <button id="runButton" class="run-button">
                    Run sync now
                </button>
            </div>
            
            <div id="qrContainer" class="qr-container" style="display: none;">
                <h3>Scan QR code with BankID</h3>
                <a id="bankidAppLink" class="bankid-app-button" style="display: none;">
                    Open BankID on this device
                </a>
                <div class="qr-wrapper">
                    <img id="qrImage" alt="QR Code for BankID authentication" />
                </div>
                <p class="qr-instructions">
                    Open your BankID app and scan the QR code above to authenticate.
                </p>
            </div>
            
            <div id="spinner" class="spinner" style="display: none;">
                <div class="spinner-circle"></div>
                <p>Processing...</p>
            </div>
            
            <div id="results" class="results"></div>
        </main>
        
        <footer>
            <p class="footer-text">
                Kivra Sync - document synchronization tool
            </p>
        </footer>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
