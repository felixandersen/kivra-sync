image:
  repository: ghcr.io/lacuna-systems/kivra-sync
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Personal identity number (YYYYMMDDXXXX). Required unless existingSecret is set.
ssn: ""

# Name of an existing Secret to read the sensitive values from instead of the
# ones in this file. Expected keys: "ssn", plus "paperless-token" when using the
# paperless storage provider and "ntfy-password" when interaction.ntfy.user is set.
existingSecret: ""

interaction:
  # web or ntfy. The local provider is not supported since it shows the
  # BankID QR code in a terminal.
  provider: web
  web:
    port: 8080
  ntfy:
    topic: ""
    server: https://ntfy.sh
    user: ""
    password: ""
    triggerMessage: run now

storage:
  # filesystem or paperless
  provider: filesystem
  filesystem:
    baseDir: /data
  paperless:
    # e.g. http://paperless.paperless.svc:8000/api
    url: ""
    token: ""
    # Comma-separated list of tags to apply to all documents
    tags: ""

fetch:
  receipts: true
  letters: true
  # 0 for unlimited
  maxReceipts: 0
  maxLetters: 0

dryRun: false

# Additional command-line arguments for kivra_sync.py
extraArgs: []

# Additional environment variables for the container
env: []

persistence:
  # Volume mounted at storage.filesystem.baseDir when using filesystem storage
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

# Service and ingress are only created with the web interaction provider
service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kivra-sync.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: kivra-sync-tls
  #    hosts:
  #      - kivra-sync.local

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
